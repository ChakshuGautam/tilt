name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-web:
    runs-on: ubuntu-latest
    name: Build web assets
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: web/yarn.lock

      - name: Build web UI
        run: |
          cd web && yarn install --immutable && yarn build

      - uses: actions/upload-artifact@v4
        with:
          name: web-assets
          path: web/build/

  build:
    needs: build-web
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            asset: tilt-linux-amd64
            cc: gcc
          - os: macos-latest
            goos: darwin
            goarch: arm64
            asset: tilt-darwin-arm64
            cc: clang
          - os: macos-latest
            goos: darwin
            goarch: amd64
            asset: tilt-darwin-amd64
            cc: clang
          - os: windows-latest
            goos: windows
            goarch: amd64
            asset: tilt-windows-amd64

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.asset }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/download-artifact@v4
        with:
          name: web-assets
          path: pkg/assets/build/

      - name: Build binary (unix)
        if: matrix.goos != 'windows'
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          SHA="${GITHUB_SHA}"
          go build -mod vendor -tags osusergo \
            -ldflags "-s -w -X 'main.version=${VERSION}' -X 'main.date=${DATE}' -X 'github.com/tilt-dev/tilt/internal/cli.commitSHA=${SHA}'" \
            -o tilt ./cmd/tilt/

      - name: Build binary (windows)
        if: matrix.goos == 'windows'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          SHA="${GITHUB_SHA}"
          CGO_ENABLED=1 GOOS=windows GOARCH=amd64 \
          go build -mod vendor -tags osusergo \
            -ldflags "-s -w -X 'main.version=${VERSION}' -X 'main.date=${DATE}' -X 'github.com/tilt-dev/tilt/internal/cli.commitSHA=${SHA}'" \
            -o tilt.exe ./cmd/tilt/

      - name: Package (unix)
        if: matrix.goos != 'windows'
        run: tar czf ${{ matrix.asset }}.tar.gz tilt

      - name: Package (windows)
        if: matrix.goos == 'windows'
        run: Compress-Archive -Path tilt.exe -DestinationPath ${{ matrix.asset }}.zip
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.*

  build-linux-arm64:
    needs: build-web
    runs-on: ubuntu-latest
    name: Build tilt-linux-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: web-assets
          path: pkg/assets/build/

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build in ARM64 container
        run: |
          docker run --rm --platform linux/arm64 \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            -e VERSION="${GITHUB_REF_NAME#v}" \
            -e SHA="${GITHUB_SHA}" \
            golang:1.25 bash -c '
              DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              CGO_ENABLED=1 go build -mod vendor -buildvcs=false -tags osusergo \
                -ldflags "-s -w -X main.version=${VERSION} -X main.date=${DATE} -X github.com/tilt-dev/tilt/internal/cli.commitSHA=${SHA}" \
                -o tilt ./cmd/tilt/
            '

      - name: Package
        run: tar czf tilt-linux-arm64.tar.gz tilt

      - uses: actions/upload-artifact@v4
        with:
          name: tilt-linux-arm64
          path: tilt-linux-arm64.tar.gz

  release:
    needs: [build, build-linux-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Keep only release archives
        run: find artifacts/ -type f ! \( -name '*.tar.gz' -o -name '*.zip' \) -delete

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
