name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            asset: tilt-linux-amd64
            cc: gcc
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            asset: tilt-linux-arm64
            cc: aarch64-linux-gnu-gcc
            extld: aarch64-linux-gnu-gcc
            cross_pkg: gcc-aarch64-linux-gnu
          - os: macos-latest
            goos: darwin
            goarch: arm64
            asset: tilt-darwin-arm64
            cc: clang
          - os: macos-latest
            goos: darwin
            goarch: amd64
            asset: tilt-darwin-amd64
            cc: clang
          - os: windows-latest
            goos: windows
            goarch: amd64
            asset: tilt-windows-amd64

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.asset }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install cross-compiler
        if: matrix.cross_pkg
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.cross_pkg }}

      - name: Build binary (unix)
        if: matrix.goos != 'windows'
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          SHA="${GITHUB_SHA}"
          EXTLD_FLAG=""
          if [ -n "${{ matrix.extld }}" ]; then
            EXTLD_FLAG="-extld=${{ matrix.extld }}"
          fi
          go build -mod vendor -tags osusergo \
            -ldflags "-s -w ${EXTLD_FLAG} -X 'main.version=${VERSION}' -X 'main.date=${DATE}' -X 'github.com/tilt-dev/tilt/internal/cli.commitSHA=${SHA}'" \
            -o tilt ./cmd/tilt/

      - name: Build binary (windows)
        if: matrix.goos == 'windows'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          SHA="${GITHUB_SHA}"
          CGO_ENABLED=1 GOOS=windows GOARCH=amd64 \
          go build -mod vendor -tags osusergo \
            -ldflags "-s -w -X 'main.version=${VERSION}' -X 'main.date=${DATE}' -X 'github.com/tilt-dev/tilt/internal/cli.commitSHA=${SHA}'" \
            -o tilt.exe ./cmd/tilt/

      - name: Package (unix)
        if: matrix.goos != 'windows'
        run: tar czf ${{ matrix.asset }}.tar.gz tilt

      - name: Package (windows)
        if: matrix.goos == 'windows'
        run: Compress-Archive -Path tilt.exe -DestinationPath ${{ matrix.asset }}.zip
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
